name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Inspect painted atlas pixels
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageStat
          p='public/assets/ui/painted-kling-icons.webp'
          im=Image.open(p).convert('RGBA')
          print('atlas', im.size, im.mode)
          for row in range(15):
            vals=[]
            for col in range(3):
              cell=im.crop((col*128,row*128,(col+1)*128,(row+1)*128))
              a=cell.getchannel('A')
              bbox=a.getbbox()
              extrema=a.getextrema()
              nonzero=sum(1 for v in a.getdata() if v)
              rgb=ImageStat.Stat(cell.convert('RGB')).mean
              vals.append(f'c{col}:bbox={bbox},alpha={extrema},nz={nonzero},rgb={tuple(round(x,1) for x in rgb)}')
            print(f'row{row}: ' + ' | '.join(vals))
          PY
