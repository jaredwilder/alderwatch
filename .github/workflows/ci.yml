name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Inspect painted WebP container
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          p=Path('public/assets/ui/painted-kling-icons.webp')
          b=p.read_bytes()
          print('actual_bytes',len(b))
          print('magic',b[:4],b[8:12])
          print('riff_declared_total', struct.unpack('<I',b[4:8])[0]+8)
          pos=12
          i=0
          while pos+8<=len(b):
            tag=b[pos:pos+4]
            size=struct.unpack('<I',b[pos+4:pos+8])[0]
            data_start=pos+8
            data_end=data_start+size
            padded=data_end+(size&1)
            print(i, 'tag', tag, 'size', size, 'start', data_start, 'end', data_end, 'padded_end', padded, 'available', len(b)-data_start, 'TRUNCATED' if data_end>len(b) else '')
            if data_end>len(b): break
            pos=padded
            i+=1
          print('parser_end',pos,'remaining',len(b)-pos)
          print('tail_hex',b[-32:].hex())
          PY
