name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Probe live painted icon response
        run: |
          echo '--- painted CSS ---'
          curl -sSIL --max-time 30 https://alderwatch.167.233.105.77.sslip.io/assets/ui/painted-item-icons.css
          echo '--- painted WebP ---'
          curl -sSIL --max-time 30 https://alderwatch.167.233.105.77.sslip.io/assets/ui/painted-kling-icons.webp
