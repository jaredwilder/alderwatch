<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
<defs>
 <linearGradient id="meat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c67865"/><stop offset=".55" stop-color="#8c453b"/><stop offset="1" stop-color="#482522"/></linearGradient>
 <linearGradient id="cook" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b46b3b"/><stop offset=".55" stop-color="#71392b"/><stop offset="1" stop-color="#351f1b"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0d58a"/><stop offset=".55" stop-color="#c0903e"/><stop offset="1" stop-color="#75501f"/></linearGradient>
 <linearGradient id="broth" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ad7448"/><stop offset="1" stop-color="#4b3126"/></linearGradient>
 <filter id="soft"><feDropShadow dx="1" dy="2" stdDeviation="1.6" flood-opacity=".48"/></filter>
